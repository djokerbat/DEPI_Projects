<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo — Team 4</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234F5E4B'><circle cx='12' cy='12' r='4'/><path d='M12 2a10 10 0 0 0-4 19.16V17a6 6 0 0 1 8 0v4.16A10 10 0 0 0 12 2z'/></svg>">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/todolist.css">
</head>
<body>
    <div class="app-layout">
        
        <!-- Mobile Topbar -->
        <header class="mobile-topbar d-md-none">
            <button class="icon-btn" id="mobileMenuToggle" aria-label="Toggle menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="brand-logo-small">
                <span class="brand-name">ToDo</span>
            </div>
            <button class="icon-btn" id="mobileThemeToggleBtn" aria-label="Toggle theme">
                <i class="fa-regular fa-moon"></i>
            </button>
        </header>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <div class="brand-logo">
                    <svg class="brand-icon" viewBox="0 0 32 32" fill="none">
                        <circle cx="16" cy="16" r="3" fill="currentColor"/>
                        <ellipse cx="16" cy="6.5" rx="2.8" ry="5.5" fill="currentColor" opacity="0.8"/>
                        <ellipse cx="16" cy="25.5" rx="2.8" ry="5.5" fill="currentColor" opacity="0.8"/>
                        <ellipse cx="6.5" cy="16" rx="5.5" ry="2.8" fill="currentColor" opacity="0.8"/>
                        <ellipse cx="25.5" cy="16" rx="5.5" ry="2.8" fill="currentColor" opacity="0.8"/>
                        <ellipse cx="9.3" cy="9.3" rx="2.8" ry="5.5" transform="rotate(-45 9.3 9.3)" fill="currentColor" opacity="0.6"/>
                        <ellipse cx="22.7" cy="9.3" rx="2.8" ry="5.5" transform="rotate(45 22.7 9.3)" fill="currentColor" opacity="0.6"/>
                        <ellipse cx="9.3" cy="22.7" rx="2.8" ry="5.5" transform="rotate(45 9.3 22.7)" fill="currentColor" opacity="0.6"/>
                        <ellipse cx="22.7" cy="22.7" rx="2.8" ry="5.5" transform="rotate(-45 22.7 22.7)" fill="currentColor" opacity="0.6"/>
                    </svg>
                    <span class="brand-name">ToDo</span>
                </div>

                <nav class="sidebar-nav">
                    <button class="nav-item active" data-filter="all">
                        <i class="fa-solid fa-house"></i>
                        <span>Home</span>
                    </button>
                    <button class="nav-item" data-filter="today">
                        <i class="fa-regular fa-calendar"></i>
                        <span>Today</span>
                    </button>
                    <button class="nav-item" data-filter="upcoming">
                        <i class="fa-regular fa-clock"></i>
                        <span>Upcoming</span>
                    </button>
                    <button class="nav-item" data-filter="completed">
                        <i class="fa-solid fa-check-double"></i>
                        <span>Completed</span>
                    </button>
                </nav>
            </div>

            <div class="sidebar-footer">
                <div class="quote-container">
                    <p class="sidebar-quote">Small steps<br>make big progress</p>
                    <span class="sidebar-heart">♡</span>
                </div>
                <div class="botanical-branch">
                    <svg viewBox="0 0 70 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M55 115 C45 90 35 60 25 15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                        <path d="M25 15 C15 10 12 2 24 2 C32 2 28 10 25 15 Z" fill="#D3DDD0" stroke="currentColor" stroke-width="1.8"/>
                        <path d="M30 40 C14 36 12 24 24 26 C32 28 32 36 30 40 Z" fill="#D3DDD0" stroke="currentColor" stroke-width="1.8"/>
                        <path d="M32 42 C48 38 52 26 40 28 C32 30 32 38 32 42 Z" fill="#D3DDD0" stroke="currentColor" stroke-width="1.8"/>
                        <path d="M36 68 C20 64 18 52 30 54 C38 56 38 64 36 68 Z" fill="#D3DDD0" stroke="currentColor" stroke-width="1.8"/>
                        <path d="M38 70 C54 66 58 54 46 56 C38 58 38 66 38 70 Z" fill="#D3DDD0" stroke="currentColor" stroke-width="1.8"/>
                        <path d="M43 95 C28 92 26 80 38 82 C46 84 45 92 43 95 Z" fill="#D3DDD0" stroke="currentColor" stroke-width="1.8"/>
                        <path d="M45 97 C60 94 62 82 51 84 C44 86 44 94 45 97 Z" fill="#D3DDD0" stroke="currentColor" stroke-width="1.8"/>
                    </svg>
                </div>
            </div>
        </aside>

        <!-- Sidebar Backdrop for Mobile -->
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <h1 class="greeting-heading">Welcome,</h1>
                    <div class="user-signature">
                        <span id="displayUserName">Team 4</span>
                        <span class="heart-symbol">♡</span>
                    </div>
                </div>

                <div class="header-right">
                    <!-- Search Input -->
                    <div class="search-box-wrapper" id="searchWrapper">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" class="search-input" id="taskSearchInput" placeholder="Search tasks..." aria-label="Search tasks">
                    </div>

                    <!-- Theme Toggle -->
                    <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle dark/light mode" aria-label="Toggle theme">
                        <i class="fa-regular fa-moon" id="themeIcon"></i>
                    </button>
                </div>
            </header>

            <!-- Task Input Section (Direct & Clean) -->
            <section class="task-input-section">
                <form class="input-card" id="addTaskForm">
                    <input 
                        type="text" 
                        id="newTaskInput" 
                        class="task-text-input" 
                        placeholder="Add a new task..." 
                        autocomplete="off"
                        required
                    >
                    <div class="input-actions">
                        <!-- Quick Tag Selector -->
                        <select id="quickTagSelect" class="form-select-tag" aria-label="Select tag">
                            <option value="Today">Today</option>
                            <option value="Tomorrow">Tomorrow</option>
                            <option value="This week">This week</option>
                            <option value="Upcoming">Upcoming</option>
                        </select>

                        <!-- Priority Toggle Flag -->
                        <button type="button" class="btn-flag-toggle" id="quickPriorityBtn" title="Toggle priority">
                            <i class="fa-regular fa-flag"></i>
                        </button>

                        <!-- Add Button -->
                        <button type="submit" class="btn-add-task" id="addTaskBtn" aria-label="Add task">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                </form>
            </section>

            <!-- Filter Pills -->
            <nav class="filter-pills-bar">
                <button class="filter-pill active" data-filter="all">All</button>
                <button class="filter-pill" data-filter="today">Today</button>
                <button class="filter-pill" data-filter="upcoming">Upcoming</button>
                <button class="filter-pill" data-filter="completed">Completed</button>
            </nav>

            <!-- Tasks Container -->
            <section class="tasks-card">
                <div class="tasks-header-row d-none" id="tasksActiveFilterTitle">
                    <span class="active-filter-badge" id="filterStatusText">All Tasks</span>
                    <button type="button" class="clear-completed-btn d-none" id="clearCompletedBtn">Clear completed</button>
                </div>

                <!-- List of tasks rendered dynamically -->
                <div class="tasks-list" id="tasksList"></div>

                <!-- Empty State -->
                <div class="tasks-empty-state d-none" id="emptyState">
                    <div class="empty-icon">
                        <i class="fa-regular fa-clipboard"></i>
                    </div>
                    <p class="empty-title">No tasks found</p>
                    <p class="empty-subtitle">Take a deep breath and relax, or add a new task above!</p>
                </div>
            </section>
        </main>

        <!-- Right Panel (Widgets) -->
        <aside class="right-panel">
            <!-- Aesthetic Image / Quote Card -->
            <div class="aesthetic-quote-card">
                <div class="quote-image-container">
                    <img src="images/quote-bg.jpg" alt="Aesthetic dusk view" class="quote-bg-img" id="quoteImg">
                    <div class="quote-overlay">
                        <div class="handwritten-quote">
                            <span class="quote-line-1">Better things</span>
                            <span class="quote-line-2">ahead <span class="quote-heart">♡</span></span>
                            <span class="quote-bottom-heart">♡</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Progress Widget -->
            <div class="widget-card progress-widget">
                <div class="widget-header">
                    <h2 class="widget-title">Today's progress</h2>
                    <span class="progress-ratio" id="todayProgressRatio">0/0</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-track">
                        <div class="progress-bar-fill" id="todayProgressBar" style="width: 0%;"></div>
                    </div>
                </div>
            </div>

            <!-- Quick View Widget -->
            <div class="widget-card quick-view-widget">
                <h2 class="widget-title mb-3">Quick view</h2>
                <div class="quick-view-list">
                    <div class="quick-view-item" id="filterHighPriority" role="button" title="View high priority tasks">
                        <div class="quick-view-left">
                            <span class="status-indicator-dot dot-red"></span>
                            <span class="quick-label">High priority</span>
                        </div>
                        <span class="quick-count" id="countHighPriority">0</span>
                    </div>

                    <div class="quick-view-item" id="filterDueToday" role="button" title="View tasks due today">
                        <div class="quick-view-left">
                            <span class="status-indicator-dot dot-amber"></span>
                            <span class="quick-label">Due today</span>
                        </div>
                        <span class="quick-count" id="countDueToday">0</span>
                    </div>

                    <div class="quick-view-item" id="filterCompleted" role="button" title="View completed tasks">
                        <div class="quick-view-left">
                            <span class="status-indicator-dot dot-green"></span>
                            <span class="quick-label">Completed</span>
                        </div>
                        <span class="quick-count" id="countCompleted">0</span>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Edit Task Modal (Single, Clean Modal) -->
    <div class="modal fade" id="editTaskModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content custom-modal">
                <div class="modal-header border-0 pb-1">
                    <h3 class="modal-title fs-5">Edit Task</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body py-2">
                    <div class="mb-3">
                        <label for="editTaskTitle" class="form-label text-muted small">Task Description</label>
                        <input type="text" class="form-control custom-input" id="editTaskTitle" required>
                    </div>
                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <label for="editTaskTag" class="form-label text-muted small">When / Tag</label>
                            <select class="form-select custom-input" id="editTaskTag">
                                <option value="Today">Today</option>
                                <option value="Tomorrow">Tomorrow</option>
                                <option value="This week">This week</option>
                                <option value="Upcoming">Upcoming</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label for="editTaskPriority" class="form-label text-muted small">Priority</label>
                            <select class="form-select custom-input" id="editTaskPriority">
                                <option value="normal">Normal</option>
                                <option value="high">High Priority</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-1">
                    <button type="button" class="btn-modal-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn-modal-primary" id="saveEditTaskBtn">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Dependencies -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/todolist.js"></script>
</body>
</html>
